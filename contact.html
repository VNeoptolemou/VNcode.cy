    />

    <link

      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"

  <body>
    <div class="container-wrapper">
      <header class="header">
        <div class="header-content">
          <div class="logo">

          <nav class="navigation">
            <a href="index.html">Home</a>

          <div class="nav-menu-toggle">
            <i class="fa-solid fa-bars"></i>
          </div>
        </div>
      </header>
    </div>

    <div class="container-wrapper">
      <section id="contact" class="contact">
        <h2 class="heading">Contact</h2>
        <div class="contact-container">
          <div class="contact-info">
            <h3 class="heading-2">Get in touch!</h3>
            <ul>
              <li>
                <p>
                  Call at
                  <a class="call-email" href="tel:96-408617">96-408617</a>
                </p>
              </li>
              <li>
                <p>
                  Email at
                  <a
                    class="call-email"
                    href="mailto:vneoptolemou98@gmail.com"
                    target="blank"
                    >vneoptolemou98@gmail.com</a
                  >
                </p>
              </li>
              <li>
                <a href="#" target="blank" title="Facebook"
                  ><i class="fa-brands fa-facebook fa-xl"></i
                ></a>
                <a href="#" target="blank" title="Instagram"
                  ><i class="fa-brands fa-instagram fa-xl"></i
                ></a>
                <a href="#" target="blank" title="X(Twitter)"
                  ><i class="fa-brands fa-x-twitter fa-xl"></i
                ></a>
                <a href="#" target="blank" title="LinkedIn"
                  ><i class="fa-brands fa-linkedin fa-xl"></i
                ></a>
              </li>
            </ul>
          </div>

          <div class="contact-form">
            <h3 class="heading-2">Submit your request..</h3>
            <form action="#">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" name="firstname" />

              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" name="lastname" />

              <label for="phone-number">Phone Number</label>
              <input type="text" id="phone-number" name="phonenumber" />

              <label for="email-address">Email Address</label>
              <input type="text" id="email-address" name="emailaddress" />

              <label for="subject">Subject</label>
              <textarea
                id="subject"
                name="subject"
                placeholder="Type your message here.."
              ></textarea>
              <input type="submit" value="Submit" />
            </form>
          </div>
        </div>
      </section>
    </div>

    <footer>
      <div class="container-wrapper">
